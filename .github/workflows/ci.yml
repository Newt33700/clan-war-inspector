# Pipeline de validation (US 2.1).
#
# Chaque etape est BLOQUANTE : les seuils de couverture (80 % global,
# 100 % sur src/domain) et de mutation (90 %) font sortir les commandes
# en erreur, donc le job echoue et la merge request n'est pas mergeable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types, tests, mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests unitaires + couverture (seuil 80 % / domaine 100 %)
        run: npm run test:coverage

      - name: Mutation testing Stryker (seuil 90 %)
        run: npm run test:mutation

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Publier le rapport de mutation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

      - name: Build Next.js
        run: npm run build
